<div class="control-acceso-page">

  <header class="topbar">

    <div class="brand">

      <img
        src="/Logo_GymFlow.png"
        alt="GymFlow"
        class="logo"
      />

    </div>

    <button
      class="back-button"
      type="button"
      (click)="volverInicio()"
    >
      Volver al inicio
    </button>

  </header>


  <main class="content">

    <section class="welcome">

      <p class="welcome-text">
        Recepción
      </p>

      <h1>
        Control de Acceso
      </h1>

      <p class="description">
        Registra la entrada de los clientes mediante su código personal.
      </p>

    </section>


    <section class="control-card">

      <div class="card-icon">
        ✅
      </div>

      <h2>
        Registrar Asistencia
      </h2>

      <p class="card-description">
        Ingresa o escanea el código de acceso del cliente.
      </p>


      <div class="scanner-container">

        <label
          for="codigoAcceso"
          class="scanner-label"
        >
          Código de acceso
        </label>

        <input
          id="codigoAcceso"
          name="codigoAcceso"
          type="text"
          class="scanner-input"
          placeholder="Escanea o escribe el código"
          autocomplete="off"
        />

        <p class="scanner-help">
          El lector de código de barras escribirá el código en este campo.
        </p>

      </div>

    </section>

  </main>


  <footer>
    GymFlow · Gestión inteligente para gimnasios
  </footer>

</div>
