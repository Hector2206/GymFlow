<div class="perfil-page">

  <header class="topbar">

    <div class="header-left">

      <button
        class="back-button"
        (click)="volver()"
      >
        ←
      </button>

      <img
        src="/Logo_GymFlow.png"
        alt="GymFlow"
        class="logo"
      />

    </div>

  </header>


  <main class="perfil-content">

    <div
      *ngIf="cargando"
      class="loading"
    >
      Cargando perfil...
    </div>


    <div
      *ngIf="error"
      class="error-message"
    >
      {{ error }}
    </div>


    <ng-container
      *ngIf="!cargando && usuario"
    >

      <section class="perfil-header">

        <div class="avatar">
          👤
        </div>

        <p class="section-label">
          Mi Perfil
        </p>

        <h1>
          {{ usuario.name }}
        </h1>

        <div class="role-badge">
          {{ usuario.role }}
        </div>

      </section>


      <section class="datos">

        <div class="dato-card">

          <div class="dato-icon">
            ✉
          </div>

          <div class="dato-info">

            <span>
              Correo electrónico
            </span>

            <strong>
              {{ usuario.correo }}
            </strong>

          </div>

        </div>


        <div class="dato-card">

          <div class="dato-icon">
            #
          </div>

          <div class="dato-info">

            <span>
              ID de usuario
            </span>

            <strong>
              {{ usuario.idUsuario }}
            </strong>

          </div>

        </div>


        <div class="dato-card">

          <div class="dato-icon">
            🛡️
          </div>

          <div class="dato-info">

            <span>
              Tipo de usuario
            </span>

            <strong>
              {{ usuario.role }}
            </strong>

          </div>

        </div>

      </section>


      <button
        class="logout-button"
        (click)="cerrarSesion()"
      >
        Cerrar sesión
      </button>

    </ng-container>

  </main>

</div>
