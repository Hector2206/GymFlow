<div class="historial-page">

  <header class="topbar">

    <div class="brand">

      <img
        src="/Logo_GymFlow.png"
        alt="GymFlow"
        class="logo"
      />

    </div>

    <button
      type="button"
      class="back-button"
      (click)="volverInicio()"
    >
      Volver al inicio
    </button>

  </header>


  <main class="content">

    <section class="welcome">

      <p class="welcome-text">
        Recepción
      </p>

      <h1>
        Historial de Asistencias
      </h1>

      <p class="description">
        Consulta las asistencias registradas de los clientes.
      </p>

    </section>


    <section class="history-card">

      <div class="card-icon">
        📅
      </div>

      <h2>
        Consultar asistencias
      </h2>

      <p>
        Selecciona un cliente para consultar sus registros de entrada.
      </p>

      <div class="placeholder">

        <span>
          La consulta de asistencias se habilitará en el siguiente paso.
        </span>

      </div>

    </section>

  </main>


  <footer>
    GymFlow · Gestión inteligente para gimnasios
  </footer>

</div>
