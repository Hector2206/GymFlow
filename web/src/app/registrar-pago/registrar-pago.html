<div class="pago-page">

  <header class="topbar">

    <div class="header-left">

      <button
        type="button"
        class="back-button"
        (click)="volverInicio()"
      >
        ←
      </button>

      <img
        src="/Logo_GymFlow.png"
        alt="GymFlow"
        class="logo"
      />

    </div>

  </header>


  <main class="content">

    <section class="page-header">

      <p class="section-label">
        Recepción
      </p>

      <h1>
        Registrar Pago
      </h1>

      <p class="subtitle">
        Registra pagos y renovaciones de los clientes.
      </p>

    </section>


    <section class="payment-section">

      <h2>
        Datos del pago
      </h2>

      <p class="section-description">
        Completa la información necesaria para registrar el pago.
      </p>


      <div class="placeholder">

        <span class="placeholder-icon">
          💳
        </span>

        <p>
          El formulario de pago se habilitará en el siguiente paso.
        </p>

      </div>

    </section>

  </main>

</div>
