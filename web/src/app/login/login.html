<div class="login-page">

  <main class="login-card">

    <div class="logo-container">

      <img
        src="/Logo_GymFlow.png"
        alt="GymFlow"
        class="logo"
      />

    </div>


    <section class="login-header">

      <h1>
        Bienvenido
      </h1>

      <p>
        Inicia sesión para continuar
      </p>

    </section>


    <form
      autocomplete="off"
      (ngSubmit)="iniciarSesion()"
    >

      <div class="field">

        <label for="correo">
          Correo electrónico
        </label>

        <div class="input-wrapper">

          <span class="input-icon">
            @
          </span>

          <input
            id="correo"
            name="correo"
            type="email"
            [(ngModel)]="correo"
            placeholder="correo@gymflow.com"
            autocomplete="email"
          />

        </div>

      </div>


      <div class="field">

        <label for="password">
          Contraseña
        </label>

        <div class="input-wrapper">

          <span class="input-icon password-icon">
            •
          </span>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />

        </div>

      </div>


      <div
        *ngIf="error"
        class="login-error"
      >
        {{ error }}
      </div>


      <button
        type="submit"
        class="login-button"
        [disabled]="cargando || cargandoGoogle"
      >

        {{
          cargando
            ? 'Iniciando sesión...'
            : 'Iniciar sesión'
        }}

      </button>

    </form>


    <div class="separator">

      <span></span>

      <p>
        o continúa con
      </p>

      <span></span>

    </div>


    <div
      id="google-login-button"
      class="google-login-container"
    >
    </div>


    <p
      *ngIf="cargandoGoogle"
      class="google-note"
    >
      Iniciando sesión con Google...
    </p>

  </main>

</div>
