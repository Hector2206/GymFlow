<div class="login-page">

  <div class="login-card">

    <img
      src="/Logo_GymFlow.png"
      alt="GymFlow"
      class="logo"
    />

    <h1>GYMFLOW</h1>

    <p class="subtitle">
      Iniciar sesión
    </p>


    <form
      autocomplete="off"
      (ngSubmit)="iniciarSesion()"
    >

      <div class="field">

        <label for="correo">
          Correo electrónico
        </label>

        <div class="input-wrapper">

          <span class="icon">
            ✉
          </span>

          <input
            id="correo"
            name="correo"
            type="email"
            [(ngModel)]="correo"
            placeholder="correo@gymflow.com"
            autocomplete="email"
          />

        </div>

      </div>


      <div class="field">

        <label for="password">
          Contraseña
        </label>

        <div class="input-wrapper">

          <span class="icon">
            🔒
          </span>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />

        </div>

      </div>


      <div
        *ngIf="error"
        class="login-error"
      >
        {{ error }}
      </div>


      <button
        type="submit"
        class="login-button"
        [disabled]="cargando || cargandoGoogle"
      >

        {{
          cargando
            ? 'Iniciando sesión...'
            : 'Iniciar sesión'
        }}

      </button>

    </form>


    <div class="separator">

      <span></span>

      <p>
        o continúa con
      </p>

      <span></span>

    </div>


    <div
      id="google-login-button"
      class="google-login-container"
    >
    </div>


    <p
      *ngIf="cargandoGoogle"
      class="google-note"
    >
      Iniciando sesión con Google...
    </p>


    <p class="footer">
      GymFlow · Gestión inteligente para gimnasios
    </p>

  </div>

</div>
